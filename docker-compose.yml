version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: watsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: watsy_chatbot
      POSTGRES_USER: ahmed
      POSTGRES_PASSWORD: ahmed
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - watsy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahmed -d watsy_chatbot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: watsy-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - watsy-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "ahmed", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  # pgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: watsy-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@watsy.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - watsy-network
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - tools

# Named volumes for persistent data storage
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

# Custom network for service communication
networks:
  watsy-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
